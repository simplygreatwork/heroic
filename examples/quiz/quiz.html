
<div>
	<div class="container">
		<section class="content">
			<header data-title class="title">Quiz</header>
			<div>0 of 0 is 0%.</div>
			<section class="scroll">	
				<section name="template" data-component="../shared/views/empty.html" data-template></section>
				<br><br><br><br><br><br><br>
			</section>
		</section>
		<section name="void" class="void" data-component="../shared/views/empty.html"></section>
	</div>
	<link rel="stylesheet" type="text/css" href="../quiz/quiz.css"/>
	<script type="module">
		
		import { Component } from 'component'
		import { Bus } from 'bus'
		import { Scope } from 'scope'
		import { Cloud } from 'cloud'
		import { bind } from 'bind'
		
		let counter = 0
		
		Component.ready(({ component, data, $ }) => {
			
			const bus = data.bus || new Bus()
			const cloud = Cloud(bus)
			const scope = cloud.scope
			const template = component.child('template')
			const cache = {}
			const panel = $().div[2]
			let store = {}
			
			install_rows(default_items())
			bind_cloud()
			listen()
			system.focus = this
			// console.log('quiz nab')
			router.exits('quiz', data => scope.unplug(), true)
			
			async function install_rows(items) {
				while (items.length > 0) await install_row(items)
			}
			
			function install_row(items) {
				
				return new Promise((resolve) => {
					let item = items.shift()
					let component = template.clone({ item, bus, scope, cloud })
					component.on('ready', (props) => resolve())
					component.redirect(item.path, { item, bus, scope, cloud })
				})
			}
			
			function listen() {
				
				scope.on('submitted', ({ id, answer, correct }) => {
					cloud.update(`score/counter`, (value) => ++value)
					if ((answer == correct)) cloud.update(`score/correct`, (value) => ++value)
					cloud.update(`score/total`, (value) => ++value)
				})
				
				if (false) scope.on('submitted', ({ id, answer, correct }) => {
					console.log(`store: ${JSON.stringify(store)}`)
				})
			}
			
			function default_items() {
				
				return new Array(10).fill(0).map(function(each, index) {
					const id = index + 1
					if (true) return { id, path: `./questions/multiple_choice.html` }
					if (false) return { id, path: `./questions/q${(index % 10) + 1}.html` }
				})
			}
			
			function bind_cloud() {
				
				cloud.on_get((key, result) => result.value = store[key])
				const set_ = (key, value) => { store[key] = value; cloud.change(key) }
				cloud.on_set((key, value) => set_(key, value))
				cloud.on_update((key, fn) => set_(key, fn(store[key])))
				cloud.on_change('score/total', (key, value) => {
					const total = cloud.get('score/total')
					const correct = cloud.get('score/correct')
					if (total == undefined) return
					if (correct == undefined) return
					panel.innerText = `${correct} of ${total}`
				})
				
				cloud.set(`score/total`, 0)
				cloud.set(`score/correct`, 0)
				cloud.set(`score/counter`, 0)
				cloud.set(`score/items`, {})
			}
		})
		
	</script>
</div>
